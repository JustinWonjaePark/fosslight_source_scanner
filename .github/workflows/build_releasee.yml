name: Build and Release FOSSLight Source

on:
  push:
    tags:
      - 'v*'

# 권한 문제를 방지하기 위해 YAML 내부에도 명시적으로 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        # macos-13은 Intel, macos-latest는 Apple Silicon을 위해 추가
        os: [windows-latest, ubuntu-latest, macos-13, macos-latest]
        include:
          - os: windows-latest
            artifact_name: fosslight_source.exe
          - os: ubuntu-latest
            artifact_name: fosslight_source_linux
          - os: macos-13
            artifact_name: fosslight_source_mac_intel
          - os: macos-latest
            artifact_name: fosslight_source_mac_arm
            
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -e . 
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pyinstaller --onefile --name ${{ matrix.artifact_name }} --clean src/fosslight_source/cli.py

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
