name: Build and Release FOSSLight Source

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.1.0 등 태그가 푸시될 때 실행

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 3개 OS 동시 빌드 설정
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: fosslight_source.exe
          - os: macos-latest
            artifact_name: fosslight_source_mac
          - os: ubuntu-latest
            artifact_name: fosslight_source_linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # FL Source 권장 버전 확인 필요

      - name: Install Dependencies
        run: |
          python -m venv venv
          # Windows와 Unix 계열의 venv 활성화 방식 차이 처리
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./venv/Scripts/activate
          else
            source ./venv/bin/activate
          fi
          pip install --upgrade pip
          pip install . 
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          # venv 활성화 후 빌드
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./venv/Scripts/activate
          else
            source ./venv/bin/activate
          fi
          # --onefile 옵션으로 단일 실행 파일 생성
          # entry point가 fosslight_source/cli.py 라고 가정 (실제 파일 확인 필요)
          pyinstaller --onefile --name ${{ matrix.artifact_name }} fosslight_source/cli.py

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
