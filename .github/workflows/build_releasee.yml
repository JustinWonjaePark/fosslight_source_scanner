name: Build and Release FOSSLight Source

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        # 인텔 맥 지원이 필요하면 나중에 macos-13을 추가하세요.
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: fosslight_source.exe
          - os: ubuntu-latest
            artifact_name: fosslight_source_linux
          - os: macos-latest
            artifact_name: fosslight_source_mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -e . 
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          
          # 패키지 구조 인식을 위한 경로 설정
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          
          # --collect-all 옵션을 추가하여 rfc3987 및 jsonschema의 데이터 파일 강제 포함
          pyinstaller --onefile \
                      --name ${{ matrix.artifact_name }} \
                      --clean \
                      --paths src \
                      --collect-all rfc3987_syntax \
                      --collect-all rfc3987 \
                      --collect-all jsonschema \
                      --hidden-import fosslight_source \
                      fosslight_source_launcher.py

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
