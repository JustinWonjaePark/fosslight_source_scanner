name: Build and Release FOSSLight Source

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: fosslight_source.exe
          - os: ubuntu-latest
            artifact_name: fosslight_source_linux
          - os: macos-latest
            artifact_name: fosslight_source_mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -e . 
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          
          pyinstaller --onefile \
                      --name ${{ matrix.artifact_name }} \
                      --clean \
                      --paths src \
                      --collect-all rfc3987_syntax \
                      --collect-all rfc3987 \
                      --collect-all jsonschema \
                      --collect-all scancode \
                      --collect-all extractcode \
                      --collect-all extractcode_7z \
                      --collect-all extractcode_libarchive \
                      --collect-all typecode \
                      --collect-all typecode_libmagic \
                      --collect-all summarycode \
                      --collect-all cluecode \
                      --collect-all plugincode \
                      --collect-all license_expression \
                      --collect-all text_unidecode \
                      --collect-all binaryornot \
                      --hidden-import fosslight_source \
                      fosslight_source_launcher.py

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
