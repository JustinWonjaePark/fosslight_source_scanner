name: Build and Release FOSSLight Source

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        # 인텔 맥 지원을 위해 macos-13을 포함하거나, 유니버설 빌드 전까지는 최신 버전을 사용합니다.
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: fosslight_source.exe
          - os: ubuntu-latest
            artifact_name: fosslight_source_linux
          - os: macos-latest
            artifact_name: fosslight_source_mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -e . 
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          
          # 상대 경로 임포트 해결을 위한 PYTHONPATH 설정
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          
          # 래퍼 스크립트를 빌드 대상으로 지정
          # 만약 래퍼 파일명을 다르게 하셨다면 아래 파일명을 수정하세요.
          pyinstaller --onefile \
                      --name ${{ matrix.artifact_name }} \
                      --clean \
                      --paths src \
                      --hidden-import fosslight_source \
                      fosslight_source_launcher.py

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
